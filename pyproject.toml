[project]
name = "either-option"
version = "0.1.1"
description = "Railway-Oriented Programming for Python — Option[T] and Either[T, E] sum types with sync + async combinators, sealed pattern matching, and 100% branch coverage."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Bao Do", email = "baodq97@gmail.com" },
]
keywords = [
    "option",
    "optional",
    "either",
    "result",
    "monad",
    "railway-oriented-programming",
    "rop",
    "functional",
    "typed",
    "async",
    "pattern-matching",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typing-extensions>=4.15.0",
]

[project.urls]
Homepage = "https://github.com/baodq97/either-option"
Repository = "https://github.com/baodq97/either-option"
Issues = "https://github.com/baodq97/either-option/issues"
"Upstream (C#)" = "https://github.com/nlkl/Optional"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1.385",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# ===========================================================================
# uv — package manager / runner
# ===========================================================================
[tool.uv]
required-version = ">=0.11"     # contributors trên uv quá cũ sẽ bị từ chối
default-groups = ["dev"]        # `uv sync` mặc định cài luôn dev tools
link-mode = "copy"              # Windows: cache khác ổ với venv → hardlink fail

# ===========================================================================
# Ruff — lint + format. Strictest possible: select ALL, only disable rules
# that ruff itself requires disabled (formatter conflicts, deprecated codes).
# ===========================================================================
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- Formatter conflicts (per ruff formatter docs; must be disabled) ---
    "W191",     # tab-indentation
    "E111",     # indentation-with-invalid-multiple
    "E114",
    "E117",
    "D206",     # indent-with-spaces (pydocstyle)
    "D300",     # triple-single-quotes (pydocstyle)
    "Q000",     # bad-quotes-inline-string
    "Q001",     # bad-quotes-multiline-string
    "Q002",     # bad-quotes-docstring
    "Q003",     # avoidable-escaped-quote
    "COM812",   # missing-trailing-comma  (formatter handles)
    "COM819",   # prohibited-trailing-comma
    "ISC001",   # single-line-implicit-string-concatenation
    "ISC002",   # multi-line-implicit-string-concatenation
]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["either_option"]

[tool.ruff.lint.per-file-ignores]
# Tests must be allowed to use `assert` — that is literally how pytest works.
# This is a tooling necessity, not a quality compromise.
"tests/**/*.py" = [
    "S101",     # use-of-assert  (pytest mechanic)
    "INP001",   # tests/ is intentionally a non-package
    "D100",     # missing docstring in public module
    "D103",     # missing docstring in public function  (test names are self-doc)
    "PLR2004",  # magic value in comparison  (intentional in tests)
    "PLR6301",  # method could be function  (pytest fixture injection pattern)
    "ERA001",   # commented-out code  (false positives on section headers)
    "PLW0108",  # unnecessary lambda  (test laziness via lambda is intentional)
    "RUF100",   # unused noqa  (covers test-file ignore directives)
]
# Examples are runnable scripts; print() and demo idioms are intentional.
"examples/**/*.py" = [
    "INP001",   # examples/ is intentionally a non-package
    "T201",     # print  (examples ARE demos that print)
    "D100",     # module docstring already present at top
    "D103",     # function docstrings not required in demo scripts
    "ERA001",   # comments-as-code false positives
    "S101",     # asserts permitted in demos
    "PLR2004",  # magic numbers fine in demo data
]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ===========================================================================
# Pyright — strict + every overrideable diagnostic bumped to "error".
# ===========================================================================
[tool.pyright]
include = ["src", "tests", "examples"]
exclude = [
    "reference",
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "strict"

# Bump every diagnostic that strict mode leaves at "warning" or "information"
# up to "error". Anything not listed already defaults to "error" under strict.
reportMissingTypeStubs               = "error"
reportMissingModuleSource            = "error"
reportUnnecessaryTypeIgnoreComment   = "error"
reportImplicitOverride               = "error"
reportImplicitStringConcatenation    = "error"
reportPropertyTypeMismatch           = "error"
reportImportCycles                   = "error"
reportUnusedCallResult               = "error"
reportUnnecessaryIsInstance          = "error"
reportUnnecessaryCast                = "error"
reportUnnecessaryComparison          = "error"
reportUnnecessaryContains            = "error"
reportCallInDefaultInitializer       = "error"
reportUninitializedInstanceVariable  = "error"
reportMissingSuperCall               = "error"
reportSelfClsParameterName           = "error"
reportTypeCommentUsage               = "error"
reportDeprecated                     = "error"
reportConstantRedefinition           = "error"
reportInconsistentConstructor        = "error"
reportOverlappingOverload            = "error"
reportPossiblyUnboundVariable        = "error"
reportPrivateUsage                   = "error"
reportInvalidStubStatement           = "error"
reportIncompleteStub                 = "error"
reportInvalidTypeVarUse              = "error"
reportUnsupportedDunderAll           = "error"
reportUnusedExpression               = "error"
reportMatchNotExhaustive             = "error"

# ===========================================================================
# Pytest
# ===========================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

# ===========================================================================
# Coverage
# ===========================================================================
[tool.coverage.run]
branch = true
source = ["src/either_option"]
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_also = [
    # Defensive guards that should never run for well-typed callers.
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
    "\\.\\.\\.$",  # bare ellipsis on stub bodies
]
